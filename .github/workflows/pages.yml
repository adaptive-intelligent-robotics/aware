name: Deploy AWARE website

on:
  push:
    branches:
      - aware-site

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/aware-site'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Stage public website files
        run: |
          mkdir -p "$RUNNER_TEMP/aware-pages"
          cp index.html styles.css script.js .nojekyll "$RUNNER_TEMP/aware-pages/"
          cp -R assets "$RUNNER_TEMP/aware-pages/assets"

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/aware-pages
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
