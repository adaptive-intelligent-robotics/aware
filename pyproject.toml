[project]
name = "aware"
version = "1.0.0"
description = "Adaptive World-Models for Anomaly Recognition (AWARE), CoRL 2026"
readme = "README.md"
requires-python = ">=3.10,<3.11"
# versions match the environment used for the paper results
dependencies = [
  "jax[cuda12]==0.5.0",
  "flax==0.10.2",
  "optax==0.2.4",
  "ninjax==3.6.2",
  "elements==3.21.0",
  "torch==2.6.0",
  "mujoco==3.2.7",
  "mujoco-mjx==3.2.7",
  "playground==0.0.3",
  "ml-collections==1.0.0",
  "numpy==1.26.4",
  "scipy==1.15.1",
  "scikit-learn==1.7.0",
  "pandas==2.2.3",
  "matplotlib==3.10.0",
  "seaborn==0.13.2",
  "mediapy==1.2.2",
  "einops==0.8.1",
  "hydra-core==1.3.2",
  "omegaconf==2.3.0",
  "pyyaml",
  "dill==0.3.9",
  "py-lz4framed==0.14.0",
  "tqdm",
  "wandb==0.19.6",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aware.env.crane" = ["mjcf/*.xml"]
