# Train RSSM AWARE or Transformer AWARE on a dataset generated by scripts/generate_data.py
#   python scripts/train.py model=rssm_aware dataset_path=data/sim/<date>/<time>

defaults:
  - _self_
  - model: transformer_aware # rssm_aware or transformer_aware
  - trainer: ${model}        # each model has a trainer config of the same name

exp_name: ${hydra:runtime.choices.model}
dataset_path: ???            # generated dataset folder, relative to the repository root
seed: 1
device: cuda
savedir: run                 # inside the hydra run folder, outputs/<date>/<time>/run

logging:
  log_rate: 1
  log_to_wandb: false
  log_to_terminal: true
  log_to_JSON: true
  main_logdir: ${savedir}
  save_configs_as: config.yaml
  json_filename: metrics.jsonl
  media_logdir: ${savedir}/media
  media_log_rate: 25
  video_frames: 1000
  debug_log_level: 1

wandb:
  project: aware
  job_type: train
  name: ${exp_name} ${now:%m-%d/%H-%M-%S}

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: true
